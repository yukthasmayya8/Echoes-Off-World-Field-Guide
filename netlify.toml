[build]
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

[context.production.environment]
  # Base URL of the deployed Echoes backend, including the /api/v1 prefix.
  # Set this to the live backend host before the final production deploy,
  # e.g. https://your-deployed-backend.example.com/api/v1
  VITE_API_BASE_URL = "https://REPLACE_WITH_DEPLOYED_BACKEND/api/v1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
